apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: {{ .Values.grafana.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- with .Values.grafana.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  deployment:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsGroup: 65534
            runAsUser: 65534
            fsGroup: 65534
          volumes:
            - name: provisioning
              emptyDir: {}
          initContainers:
            - name: init-provisioning
              image: busybox
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                capabilities:
                  drop: [ALL]
              command:
                - sh
                - -c
                - |
                  mkdir -p /etc/grafana/provisioning/datasources
                  mkdir -p /etc/grafana/provisioning/dashboards
                  mkdir -p /etc/grafana/provisioning/notifiers
                  mkdir -p /etc/grafana/provisioning/plugins
                  mkdir -p /etc/grafana/provisioning/alerting
              volumeMounts:
                - name: provisioning
                  mountPath: /etc/grafana/provisioning
          containers:
            - name: grafana
              image: {{ .Values.grafana.deployment.image.repository }}:{{ .Values.grafana.deployment.image.tag }}
              imagePullPolicy: {{ .Values.grafana.deployment.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: [ALL]
              resources:
                {{- toYaml .Values.grafana.deployment.resources | nindent 16 }}
              volumeMounts:
                - name: provisioning
                  mountPath: /etc/grafana/provisioning
              # --- env block unchanged from your reference ---
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_DATABASE_TYPE
                  value: "postgres"
                - name: GF_DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_DATABASE_HOST
                - name: GF_DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_DATABASE_NAME
                - name: GF_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_DATABASE_USER
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: GF_DATABASE_PASSWORD
  config:
    log:
      mode: "{{ .Values.grafana.config.log.mode }}"
      level: "{{ .Values.grafana.config.log.level }}"
    auth:
      disable_login_form: "{{ .Values.grafana.config.auth.disableLoginForm }}"