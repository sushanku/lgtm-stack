apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: mimir
      inputName: DS_PROMETHEUS 
  grafanaCom:
    id: 1860

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-dashboard-new
  namespace: {{ .Release.Namespace }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: mimir
      inputName: DS__VICTORIAMETRICS 
  grafanaCom:
    id: 11074

---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: aws-rds-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: cloudwatch
      inputName: cloudwatch
  grafanaCom:
    id: 707
