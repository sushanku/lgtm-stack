environment: development

spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: git@github.com:sushanku/lgtm-stack.git
    targetRevision: main

applications:
  - name: grafana-operator
    namespace: monitoring
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana-operator
    targetRevision: 5.22.2
  - name: alloy
    valueFiles:
      - values-development.yaml
  - name: grafana
    valueFiles:
      - values-development.yaml
  - name: loki
    valueFiles:
      - values-development.yaml
  - name: mimir
    valueFiles:
      - values-development.yaml
  - name: tempo
    valueFiles:
      - values-development.yaml
  - name: flaskapp
    path: example-app/flaskchart
    valueFiles:
      - values.yaml
  - name: postgres
    path: example-app/postgreschart
    valueFiles:
      - values.yaml
