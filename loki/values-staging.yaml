resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

persistence:
  storage:
    size: 50Gi
  wal:
    size: 20Gi

config:
  filesystem:
    directory: /data/chunks

  compactor:
    compaction_interval: 10m
    retention_delete_worker_count: 150

  limits_config:
    reject_old_samples_max_age: 168h  # 7 days