apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loki.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loki.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: {{ .Values.config.auth_enabled }}

    compactor:
      working_directory: {{ .Values.config.compactor.working_directory }}
      compaction_interval: {{ .Values.config.compactor.compaction_interval }}

    ingester:
      chunk_block_size: {{ .Values.config.ingester.chunk_block_size }}
      chunk_idle_period: {{ .Values.config.ingester.chunk_idle_period }}
      chunk_retain_period: {{ .Values.config.ingester.chunk_retain_period }}
      lifecycler:
        ring:
          kvstore:
            store: {{ .Values.config.ingester.lifecycler.ring.kvstore.store }}
          replication_factor: {{ .Values.config.ingester.lifecycler.ring.replication_factor }}

    limits_config:
      reject_old_samples: {{ .Values.config.limits_config.reject_old_samples }}
      reject_old_samples_max_age: {{ .Values.config.limits_config.reject_old_samples_max_age }}
      allow_structured_metadata: {{ .Values.config.limits_config.allow_structured_metadata }}
      volume_enabled: true

    schema_config:
      configs:
        - from: "2020-10-24"
          object_store: filesystem
          store: tsdb
          schema: v11
          index:
            prefix: index_
            period: 24h

    server:
      http_listen_port: {{ .Values.config.server.http_listen_port }}

    common:
      path_prefix: {{ .Values.config.common.path_prefix }}
      replication_factor: {{ .Values.config.common.replication_factor }}

    table_manager:
      retention_deletes_enabled: {{ .Values.config.table_manager.retention_deletes_enabled }}

    ruler:
      storage:
        type: {{ .Values.config.ruler.storage.type }}
        local:
          directory: {{ .Values.config.ruler.storage.local.directory }}
      rule_path: {{ .Values.config.ruler.rule_path }}
      alertmanager_url: {{ .Values.config.ruler.alertmanager_url }}
      ring:
        kvstore:
          store: {{ .Values.config.ruler.ring.kvstore.store }}
      enable_api: {{ .Values.config.ruler.enable_api }}