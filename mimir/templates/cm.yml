apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: {{ .Release.Namespace }}
data:
  mimir.yaml: |
    multitenancy_enabled: false
    blocks_storage:
      tsdb:
        dir: /data/tsdb
        retention_period: {{ .Values.config.tsdbRetention }}
        ship_interval: 5m
        ship_concurrency: 10
        block_ranges_period: [{{ .Values.config.tsdbBlockRange | quote }}]
        wal_compression_enabled: true
        wal_segment_size_bytes: 134217728
        head_compaction_interval: 1m
        head_compaction_concurrency: 1
        head_compaction_idle_timeout: 1h
        memory_snapshot_on_shutdown: true
        flush_blocks_on_shutdown: true
      bucket_store:
        sync_dir: /data/tsdb-sync
        sync_interval: 5m
        index_cache:
          backend: inmemory
          inmemory:
            max_size_bytes: 1073741824

    compactor:
      data_dir: /data/mimir-compactor
      sharding_ring:
        kvstore:
          store: memberlist

    distributor:
      ring:
        instance_addr: ""
        kvstore:
          store: memberlist

    ingester:
      ring:
        instance_addr: ""
        kvstore:
          store: memberlist
        replication_factor: 1
        tokens_file_path: /data/tokens
        zone_awareness_enabled: true
        heartbeat_period: 15s
        heartbeat_timeout: 1m

    ruler:
      rule_path: /data/mimir-ruler
      ring:
        kvstore:
          store: memberlist
        instance_addr: ""

    store_gateway:
      sharding_ring:
        replication_factor: 1

    query_scheduler:
      max_outstanding_requests_per_tenant: 100

    limits:
      max_label_names_per_series: 40
      max_label_name_length: 1024
      max_label_value_length: 2048
      max_cache_freshness: 1m
      max_queriers_per_tenant: 10
      max_query_lookback: 720h
      max_query_parallelism: 14
